services:
  # Redis service (using Render's Redis)
  - type: redis
    name: portfolio-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: [] # Allow all connections (restricted by service binding)

  # Server API Service - Using Docker
  - type: web
    name: portfolio-server
    runtime: docker
    repo: https://github.com/Manoj-Sunar/My-Portfolio # Replace with your repo
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          name: portfolio-redis
          type: redis
          property: connectionString